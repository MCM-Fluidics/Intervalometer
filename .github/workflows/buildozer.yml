name: Build Android APK (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull buildozer Docker image
        run: docker pull kivy/buildozer:latest

      - name: Build APK with Buildozer (inside Docker as non-root)
        run: |
          set -euo pipefail
          # Run container as the current runner user to avoid root-owned files.
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}":/home/user/host \
            -w /home/user/host \
            kivy/buildozer:latest \
            /bin/bash -lc "yes y | buildozer -v android debug"

      - name: List build outputs
        run: ls -la bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: bin/*.apk
