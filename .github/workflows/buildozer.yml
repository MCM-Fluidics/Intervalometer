name: Build Android APK (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull buildozer Docker image
        run: docker pull kivy/buildozer:latest

      - name: Build APK with Buildozer (inside Docker)
        run: |
          set -euo pipefail
          # Ensure workspace ownership so the container can write outputs
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
          docker run --rm \
            -v "${{ github.workspace }}":/home/user/host \
            -w /home/user/host \
            kivy/buildozer:latest \
            /bin/bash -lc "buildozer -v android debug"

      - name: List build outputs
        run: ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: bin/*.apk
