name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up supported Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install pip==24.3.1
          python -m pip install buildozer cython==0.29.34

      - name: Build debug APK
        run: yes | python -m buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: night-intervalometer-debug-apk
          path: bin/*.apk
          if-no-files-found: error
