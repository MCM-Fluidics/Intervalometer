name: Build Android APK (Buildozer on runner)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk git zip unzip python3-pip python3-venv build-essential \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev cmake swig

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      - name: Create Python venv and pin pip
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip==24.3.1

      - name: Install Buildozer + prerequisites in venv
        run: |
          . .venv/bin/activate
          # pin cython to a known-good version used in the README
          python -m pip install cython==0.29.34
          python -m pip install buildozer
          # optional: ensure requirements in repo are installed locally (not strictly required for buildozer)
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt || true; fi

      - name: Run Buildozer (non-interactive)
        env:
          # If Buildozer prompts about root in some environments, allow it (defensive).
          BUILDOZER_ALLOW_ROOT: "1"
        run: |
          . .venv/bin/activate
          # Force non-interactive positive answers for any prompts
          yes y | buildozer -v android debug

      - name: Show build outputs
        run: ls -la bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: night-intervalometer-apks
          path: bin/*.apk
