name: Build Android APK (Buildozer on runner)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install system packages (autotools, libtool, build deps)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip python3-venv build-essential \
            autoconf automake libtool libtool-bin m4 gettext \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev cmake swig liblzma-dev libreadline-dev \
            libsqlite3-dev uuid-dev

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      - name: Create Python venv and pin pip
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip==24.3.1

      - name: Install Buildozer + prerequisites in venv
        run: |
          . .venv/bin/activate
          python -m pip install cython==0.29.34
          python -m pip install buildozer python-for-android
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt || true; fi

      - name: Clean previous build artifacts
        run: |
          rm -rf .buildozer bin || true
     
      - name: Initialize autotools and libtool macros
        run: |
          libtoolize --install --force --verbose
          autoreconf --install --force --verbose || true

      - name: Run Buildozer (non-interactive)
        env:
          BUILDOZER_ALLOW_ROOT: "1"
          LDFLAGS: "-L/usr/local/lib"
          LD_LIBRARY_PATH: "/usr/local/lib"
          M4: "/usr/bin/m4"
        run: |
          . .venv/bin/activate
          # Force non-interactive positive answers for any prompts
          yes y | buildozer -v android debug

      - name: Show build outputs
        run: ls -la bin || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: night-intervalometer-apks
          path: bin/*.apk
